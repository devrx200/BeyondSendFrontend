<svg id='patternId' width='100%' height='100%' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <!-- Premium Metallic Gold & Deep Navy Subtle Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153C4D" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F2B37" stop-opacity="0.08" />
    </linearGradient>

    <!-- Ultra Soft Faded Shadow Filter for Premium Texture Feel -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <style>
      .edu-icon-gold { fill: url(#goldGrad); stroke: #D97706; stroke-opacity: 0.20; stroke-linecap: round; stroke-linejoin: round; filter: url(#softShadow); }
      .edu-icon-teal { fill: url(#tealGrad); stroke: #153C4D; stroke-opacity: 0.18; stroke-linecap: round; stroke-linejoin: round; filter: url(#softShadow); }
      .edu-stroke-gold { stroke: #D97706; stroke-opacity: 0.20; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: url(#softShadow); }
      .edu-stroke-teal { stroke: #153C4D; stroke-opacity: 0.18; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: url(#softShadow); }
      .dot-accent-gold { fill: #D97706; fill-opacity: 0.18; }
      .dot-accent-teal { fill: #153C4D; fill-opacity: 0.15; }
    </style>

    <pattern id='a' patternUnits='userSpaceOnUse' width='260' height='260' patternTransform='scale(1)'>
      <!-- Pure White Smooth Background -->
      <rect x='0' y='0' width='100%' height='100%' fill='#FFFFFF'/>
      
      <!-- SUBTLE DOT ACCENTS BETWEEN DIAGONAL ICONS -->
      <circle cx="65" cy="65" r="1.8" class="dot-accent-gold"/>
      <circle cx="195" cy="65" r="1.8" class="dot-accent-teal"/>
      <circle cx="65" cy="195" r="1.8" class="dot-accent-teal"/>
      <circle cx="195" cy="195" r="1.8" class="dot-accent-gold"/>
      <circle cx="130" cy="130" r="2.2" class="dot-accent-gold"/>
      <circle cx="0" cy="130" r="1.8" class="dot-accent-teal"/>
      <circle cx="260" cy="130" r="1.8" class="dot-accent-teal"/>
      <circle cx="130" cy="0" r="1.8" class="dot-accent-gold"/>
      <circle cx="130" cy="260" r="1.8" class="dot-accent-gold"/>

      <!-- 1. Graduation Cap & Diploma Scroll -->
      <g transform="translate(15, 15) scale(0.72)">
        <polygon points="20,4 36,11 20,18 4,11" class="edu-icon-gold" stroke-width="1.2"/>
        <path d="M10 14 L10 23 C10 27 30 27 30 23 L30 14" class="edu-stroke-gold" stroke-width="1.2"/>
        <path d="M36 11 L36 24 M34 24 L38 24" class="edu-stroke-gold" stroke-width="1.2"/>
        <circle cx="36" cy="25" r="1.5" class="dot-accent-gold"/>
        <rect x="2" y="27" width="20" height="7" rx="3.5" class="edu-icon-gold" stroke-width="1"/>
        <line x1="8" y1="27" x2="8" y2="34" class="edu-stroke-gold" stroke-width="0.8"/>
      </g>

      <!-- 2. Open Book & Fountain Pen -->
      <g transform="translate(145, 15) scale(0.7)">
        <path d="M4 24 Q15 18 26 24 L26 8 Q15 2 4 8 Z" class="edu-icon-teal" stroke-width="1.2"/>
        <path d="M48 24 Q37 18 26 24 L26 8 Q37 2 48 8 Z" class="edu-icon-teal" stroke-width="1.2"/>
        <line x1="26" y1="8" x2="26" y2="24" class="edu-stroke-teal" stroke-width="1.2"/>
        <path d="M33 2 L38 12 L35 14 L30 4 Z" class="edu-icon-gold" stroke-width="1"/>
      </g>

      <!-- 3. Space Rocket Launch & Stars -->
      <g transform="translate(80, 80) scale(0.72)">
        <path d="M15 2 C15 2 24 11 24 20 L6 20 C6 11 15 2 15 2 Z" class="edu-icon-gold" stroke-width="1.2"/>
        <circle cx="15" cy="12" r="3" class="edu-icon-teal" stroke-width="1"/>
        <path d="M6 20 L2 27 M24 20 L28 27 M10 20 L10 27 M20 20 L20 27" class="edu-stroke-gold" stroke-width="1.2"/>
      </g>

      <!-- 4. Excellence Trophy & Laurel Star -->
      <g transform="translate(210, 80) scale(0.7)">
        <path d="M6 4 L24 4 L22 17 C22 22 8 22 8 17 Z" class="edu-icon-gold" stroke-width="1.2"/>
        <path d="M6 8 L2 8 C2 15 8 15 8 15 M24 8 L28 8 C28 15 22 15 22 15" class="edu-stroke-gold" stroke-width="1.2"/>
        <line x1="15" y1="22" x2="15" y2="28" class="edu-stroke-gold" stroke-width="1.5"/>
        <rect x="7" y="28" width="16" height="5" rx="1.5" class="edu-icon-gold" stroke-width="1"/>
      </g>

      <!-- 5. University Facade Dome & Kalash -->
      <g transform="translate(15, 145) scale(0.68)">
        <path d="M20 4 C11 4 7 13 7 18 L33 18 C33 13 29 4 20 4 Z" class="edu-icon-teal" stroke-width="1.2"/>
        <circle cx="20" cy="2" r="1.5" class="dot-accent-gold"/>
        <rect x="4" y="18" width="32" height="4" class="edu-icon-teal" stroke-width="1"/>
        <line x1="9" y1="22" x2="9" y2="33" class="edu-stroke-teal" stroke-width="1.5"/>
        <line x1="16" y1="22" x2="16" y2="33" class="edu-stroke-teal" stroke-width="1.5"/>
        <line x1="24" y1="22" x2="24" y2="33" class="edu-stroke-teal" stroke-width="1.5"/>
        <line x1="31" y1="22" x2="31" y2="33" class="edu-stroke-teal" stroke-width="1.5"/>
        <rect x="2" y="33" width="36" height="5" rx="1" class="edu-icon-teal" stroke-width="1"/>
      </g>

      <!-- 6. Student Studying & Tablet -->
      <g transform="translate(145, 145) scale(0.7)">
        <circle cx="16" cy="8" r="4.5" class="edu-icon-gold" stroke-width="1"/>
        <path d="M16 14 C10 14 4 19 4 27 L28 27 C28 19 22 14 16 14 Z" class="edu-icon-teal" stroke-width="1.2"/>
        <path d="M6 25 Q16 20 26 25 L26 30 Q16 25 6 30 Z" class="edu-icon-gold" stroke-width="1"/>
      </g>

      <!-- 7. Computer Science Laptop & Code `< />` -->
      <g transform="translate(210, 210) scale(0.7)">
        <rect x="5" y="4" width="24" height="16" rx="2.5" class="edu-icon-teal" stroke-width="1.2"/>
        <path d="M11 10 L8 12 L11 14 M23 10 L26 12 L23 14 M18 9 L16 15" class="edu-stroke-teal" stroke-width="1.2"/>
        <rect x="1" y="20" width="32" height="4" rx="1.5" class="edu-icon-teal" stroke-width="1"/>
      </g>

      <!-- 8. Microscope & Chemical Flask -->
      <g transform="translate(80, 210) scale(0.68)">
        <path d="M13 4 L19 4 M16 4 L16 11 L26 26 C28 29 25 33 21 33 L11 33 C7 33 4 29 6 26 L16 11" class="edu-stroke-teal" stroke-width="1.4"/>
        <circle cx="13" cy="27" r="2" class="dot-accent-gold"/>
        <circle cx="19" cy="26" r="2.5" class="dot-accent-gold"/>
      </g>

      <!-- 9. Physics Atom Model & Electrons -->
      <g transform="translate(210, 15) scale(0.68)">
        <circle cx="18" cy="18" r="4" class="dot-accent-gold"/>
        <ellipse cx="18" cy="18" rx="16" ry="6" class="edu-stroke-teal" stroke-width="1.2" transform="rotate(30 18 18)"/>
        <ellipse cx="18" cy="18" rx="16" ry="6" class="edu-stroke-teal" stroke-width="1.2" transform="rotate(150 18 18)"/>
      </g>

      <!-- 10. Solar System & Planetary Orbits -->
      <g transform="translate(15, 80) scale(0.66)">
        <circle cx="15" cy="15" r="5.5" class="edu-icon-gold" stroke-width="1"/>
        <circle cx="15" cy="15" r="13" stroke="#D97706" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
        <circle cx="25" cy="8" r="2.8" class="edu-icon-teal" stroke-width="0.8"/>
      </g>

      <!-- 11. Mathematics Pi (π), Sqrt & Formulas -->
      <g transform="translate(145, 80) scale(0.65)">
        <path d="M4 6 L20 6 M8 6 L8 20 M16 6 L16 20 C16 22 18 22 19 20" class="edu-stroke-gold" stroke-width="1.6"/>
        <path d="M24 15 L27 22 L31 9 L40 9" class="edu-stroke-teal" stroke-width="1.4"/>
        <text x="33" y="21" font-family="sans-serif" font-size="10" font-weight="bold" fill="#153C4D" fill-opacity="0.20">x</text>
      </g>

      <!-- 12. AI Microchip & Tech Network -->
      <g transform="translate(80, 145) scale(0.7)">
        <rect x="6" y="6" width="20" height="20" rx="3.5" class="edu-icon-teal" stroke-width="1.2"/>
        <rect x="12" y="12" width="8" height="8" class="edu-icon-gold" stroke-width="0.8"/>
        <path d="M12 2 L12 6 M16 2 L16 6 M20 2 L20 6 M12 26 L12 30 M16 26 L16 30 M20 26 L20 30 M2 12 L6 12 M2 16 L6 16 M2 20 L6 20 M26 12 L30 12 M26 16 L30 16 M26 20 L30 20" class="edu-stroke-teal" stroke-width="1.1"/>
      </g>

      <!-- 13. Chhattisgarh Golden Paddy Sheaf -->
      <g transform="translate(15, 210) scale(0.68)">
        <path d="M16 32 L16 8 M16 20 Q10 13 5 9 M16 15 Q9 9 4 5 M16 20 Q22 13 27 9 M16 15 Q23 9 28 5" class="edu-stroke-gold" stroke-width="1.6"/>
        <circle cx="5" cy="9" r="2" class="dot-accent-gold"/>
        <circle cx="4" cy="5" r="2" class="dot-accent-gold"/>
        <circle cx="27" cy="9" r="2" class="dot-accent-gold"/>
        <circle cx="28" cy="5" r="2" class="dot-accent-gold"/>
      </g>

      <!-- 14. DNA Double Helix -->
      <g transform="translate(145, 210) scale(0.66)">
        <path d="M6 4 C18 13 18 21 6 30 M28 4 C18 13 18 21 28 30" class="edu-stroke-teal" stroke-width="1.5"/>
        <line x1="9" y1="9" x2="25" y2="9" class="edu-stroke-gold" stroke-width="1.2"/>
        <line x1="17" y1="17" x2="17" y2="17" class="edu-stroke-gold" stroke-width="2.5"/>
        <line x1="9" y1="25" x2="25" y2="25" class="edu-stroke-gold" stroke-width="1.2"/>
      </g>

      <!-- 15. Gear & Engineering -->
      <g transform="translate(210, 145) scale(0.66)">
        <circle cx="17" cy="17" r="7" class="edu-icon-teal" stroke-width="1.2"/>
        <circle cx="17" cy="17" r="3" fill="none" stroke="#153C4D" stroke-opacity="0.20" stroke-width="1.2"/>
        <path d="M17 6 L17 8 M17 26 L17 28 M6 17 L8 17 M26 17 L28 17 M9.5 9.5 L11 11 M23 23 L24.5 24.5 M9.5 24.5 L11 23 M23 11 L24.5 9.5" class="edu-stroke-teal" stroke-width="1.6"/>
      </g>
    </pattern>
  </defs>
  <rect width='100%' height='100%' transform='translate(0,0)' fill='url(#a)'/>
</svg>